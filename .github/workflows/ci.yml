name: Storefront CI

# La tienda es el tercer proyecto y era el único **sin** CI: el backend y el ERP tenían uno,
# pero obsoleto (Node 22, `npm run lint` con `--fix` —que pasa aunque haya errores— y
# `prisma db push --skip-generate`, flag que Prisma 7 elimina). Arreglados los dos el
# 2026-10-06; este es el que faltaba.
#
# Vive en el repo raíz, así que el workflow **filtra por ruta**: un cambio de documentación o
# del backend no tiene por qué construir la tienda.
on:
  push:
    branches: [master]
    paths:
      - 'storefront/**'
      # El gate de los workflows (`scripts/audit-workflow-inputs.mjs`) audita tambien los otros dos
      # repos: si cambia el script, este CI tiene que volver a comprobarlo.
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'storefront/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  # **Lanzable a mano.** El mismo defecto que `1d7b0e03` corrigio en el CI del ERP: sin este
  # disparador, «hacer el CI» de la tienda exigia empujar un commit (y con `paths:` filtrando por
  # ruta, un cambio de `scripts/` ni siquiera lo dispararia). Lo audita la regla 3 del gate.
  workflow_dispatch:

jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest

    # En el CI no existe el `.env.local` que sí hay en local. Las páginas de la tienda son
    # **dinámicas** (`force-dynamic`), así que el build no llama a la API y estos valores no se
    # usan para nada: están para que el build no dependa de que falte o no una variable. El
    # artefacto del CI **no se despliega** (Vercel construye el suyo), así que un
    # `NEXT_PUBLIC_*` de relleno aquí no puede filtrarse a producción.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STOREFRONT_API_KEY: ci-placeholder-no-se-usa
      STOREFRONT_CITY: La Paz
      ERP_API_URL: http://localhost:3000
      ERP_TIMEOUT_MS: '8000'

    defaults:
      run:
        working-directory: storefront

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # La tienda no tiene `.nvmrc` propio **a propósito**: Vercel lee el del directorio
          # raíz del proyecto (`storefront/`) para elegir su Node, así que añadirlo cambiaría
          # la versión de producción. Se fija aquí la misma con la que se mide en local.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Las **tres reglas auditables** nacidas el 2026-10-08 (`AGENTS.md`, `874d508`), que hasta hoy
      # nadie comprobaba: el **VALOR** de `node-version` en cada `setup-node` (el `node-version:`
      # vacio de `029f8447` parsea como `null` y el workflow se queda sin fijar Node), el invariante
      # de **`TZ`** (exactamente los tres jobs donde la zona entra en el render, y en ninguno mas) y
      # que todo workflow se pueda **lanzar a mano** o declare por que es solo manual. Va **despues**
      # de `npm ci` a proposito: el lector YAML (`js-yaml`) se resuelve de `storefront/node_modules`;
      # sin lector, el gate sale con codigo **2** (ruidoso), nunca en falso verde.
      - name: Autoprueba del gate de workflows (10 casos)
        working-directory: .
        run: node scripts/audit-workflow-inputs.mjs --self-test

      - name: Workflows (valor de Node, zona horaria del proceso y disparadores)
        working-directory: .
        run: node scripts/audit-workflow-inputs.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (con --max-warnings=0)
        run: npm run lint

      - name: Build
        run: npm run build
